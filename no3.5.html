  <!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Oops!</title>
    <style>
        body {
            font-family: 'Arial', sans-serif;
            text-align: center;
            background-color: #fce4ec;
            color: #c2185b;
        }
        h1 {
            font-size: 36px;
            margin-top: 50px;
        }
        button {
            padding: 15px 25px;
            margin: 10px;
            font-size: 18px;
            background-color: #c2185b;
            color: white;
            border: none;
            cursor: pointer;
            border-radius: 5px;
        }
        button:hover {
            background-color: #d81b60;
        }
        .gif {
            width: 400px;
            margin-top: 20px;
        }
    </style>
</head>
<body>
    <h1>How could you say no to this?!?! </h1>
    <!-- Add a sad or cute GIF here -->
    <img class="gif" src="https://media2.giphy.com/media/v1.Y2lkPTc5MGI3NjExNXd1bThqdTFka2Q2cm1nOTJidmwwZXRka2xoYmJocGp1Y2gzaW84OSZlcD12MV9pbnRlcm5hbF9naWZfYnlfaWQmY3Q9Zw/EkiLy4pE9d6lc0FeMv/giphy.gif" alt="Sad gif">

    <p>Try again beautiful</p>

    <!-- Button Options -->
    <button onclick="yesResponse()">Yes</button>
    <button onclick="noResponse(2)">No</button>

    <script>
        function yesResponse() {
            window.location.href = 'Yes.html';  // Redirect to the "Yes" page
        }

        function noResponse(noCount) {
            if (noCount === 2) {
                window.location.href = 'no4.html';  // Redirect to no2.html if second "No"
            } else if (noCount === 3) {
                window.location.href = 'no4.html';  // Redirect to no3.html if third "No"
            } else {
                window.location.href = 'Yes.html';  // After 4 "No"s, go to the "Yes" page
            }
        }
    </script>
</body>
</html>
